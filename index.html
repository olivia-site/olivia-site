<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оливия</title>
<style>
  body { font-family: Georgia, serif; background: #faf7f2; color: #333;
         display: flex; flex-direction: column; align-items: center;
         margin: 0; padding: 40px 20px; }
  .card { max-width: 600px; text-align: center; }
  img { max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  h1 { font-size: 2em; margin: 24px 0 8px; }
  p { font-size: 1.1em; color: #666; }
</style>
</head>
<body>
<div class="card">
  <img src="olivia.jpg" alt="Оливия">
  <h1>Оливия</h1>
  <p>Студентка 1 курса РУДН</p>
<button id="writeBtn">✉️ Написать мне</button>

<form id="feedbackForm" style="display:none"
      action="https://formspree.io/f/mwllvzzb" method="POST">
  <p>
    <label>Ваше имя *<br>
      <input type="text" name="name" required>
    </label>
  </p>
  <p>
    <label>Ваш email *<br>
      <input type="email" name="email" required>
    </label>
  </p>
  <p>
    <label>Сообщение<br>
      <textarea name="message" rows="4"></textarea>
    </label>
  </p>
  <button type="submit">Отправить</button>
</form>

<script>
  document.getElementById('writeBtn').addEventListener('click', function () {
    var f = document.getElementById('feedbackForm');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });
</script>
</div>
</body>
</html>
