<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оливия</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: Arial, sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:#f5f6fa;
}
.card {
  background:#fff; border-radius:20px; padding:40px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  text-align:center; max-width:420px; width:90%;
}
.photo {
  width:min(500px, 90%);
  height:auto;
  aspect-ratio:1/1;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:20px;
}
h1 { font-size:28px; color:#333; margin-bottom:8px; }
.subtitle { color:#777; font-size:16px; margin-bottom:24px; }
.contact-btn {
  background:#764ba2; color:#fff; border:none;
  padding:12px 28px; border-radius:25px;
  font-size:16px; cursor:pointer;
}
.contact-btn:hover { background:#5a3a7d; }
#feedbackForm { margin-top:20px; text-align:left; }
#feedbackForm label { display:block; font-size:14px; color:#555; margin-bottom:4px; }
#feedbackForm input, #feedbackForm textarea {
  width:100%; padding:10px; margin-bottom:14px;
  border:1px solid #ccc; border-radius:8px; font-size:14px;
}
#feedbackForm textarea { height:100px; resize:vertical; }
#feedbackForm button {
  width:auto; padding:12px 28px; background:#764ba2;
  color:#fff; border:none; border-radius:25px;
  font-size:16px; cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
  <img src="olivia.jpg" alt="Оливия" class="photo">
  <h1>Оливия</h1>
  <p class="subtitle">Студентка 1 курса РУДН</p>

  <!-- Кнопка находится ВНЕ формы -->
  <button id="contactBtn" class="contact-btn">✉️ Написать мне</button>

  <!-- Форма скрыта по умолчанию -->
  <!-- ВАЖНО: если адрес из кабинета Formspree другой,
       замени mw1lvzzb на свои символы после /f/ -->
  <form id="feedbackForm" action="https://formspree.io/f/mwllvzzb" method="POST" style="display:none">
    <label>Ваше имя *
      <input type="text" name="name" required>
    </label>
    <label>Ваш email *
      <input type="email" name="email" required>
    </label>
    <label>Сообщение
      <textarea name="message"></textarea>
    </label>
    <button type="submit">Отправить</button>
  </form>
</div>

<script>
const form = document.getElementById('feedbackForm');
const btn = document.getElementById('contactBtn');

// Клик по кнопке «Написать мне»: показать форму, спрятать кнопку
btn.addEventListener('click', function() {
  form.style.display = 'block';
  btn.style.display = 'none';
});

// Отправка без перехода на страницу Formspree
form.addEventListener('submit', async function(e) {
  e.preventDefault();
  try {
    const response = await fetch(form.action, {
      method:'POST',
      body:new FormData(form),
      headers:{'Accept':'application/json'}
    });
    if (response.ok) {
      alert('Спасибо! Сообщение отправлено.');
      form.reset();
      form.style.display = 'none';
      btn.style.display = 'inline-block';
    } else {
      alert('Не удалось отправить сообщение.');
    }
  } catch (err) {
    alert('Не удалось отправить сообщение.');
  }
});
</script>

</body>
</html>
